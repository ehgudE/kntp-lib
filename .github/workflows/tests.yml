name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify interpreter and run source tests
        run: |
          python --version
          PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Build and verify wheel and sdist
        run: |
          python -m pip install "build==1.6.1" "twine==7.0.0"
          python -m build
          python -m pip wheel --no-deps --wheel-dir rebuilt dist/*.tar.gz
          python -m twine check dist/* rebuilt/*
      - name: Test installed wheels outside the source tree
        run: |
          for wheel in dist/*.whl rebuilt/*.whl; do
            python -m venv "$RUNNER_TEMP/package-test"
            "$RUNNER_TEMP/package-test/bin/python" -m pip install --no-deps "$wheel"
            (
              cd "$RUNNER_TEMP"
              "$RUNNER_TEMP/package-test/bin/python" -I -c "import kntp; from importlib.metadata import metadata; m = metadata('kntp-lib'); assert kntp.__version__ == m['Version'] == '1.0.0'; assert m['Requires-Python'] == '>=3.11'; assert m['License-Expression'] == 'MIT'; assert 'LICENSE' in str(m.get_all('License-File')); print(kntp.__file__)"
              "$RUNNER_TEMP/package-test/bin/python" -I -m unittest discover -s "$GITHUB_WORKSPACE/tests" -v
            )
            rm -rf "$RUNNER_TEMP/package-test"
          done
