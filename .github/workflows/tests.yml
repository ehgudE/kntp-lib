name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify interpreter and run source tests
        run: |
          python --version
          PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Build wheel and sdist with isolated build requirements
        run: |
          python -m pip install "build==1.3.0"
          python -m build
          python -m pip wheel --no-deps --wheel-dir rebuilt dist/*.tar.gz
      - name: Test installed wheels outside the source tree
        run: |
          for wheel in dist/*.whl rebuilt/*.whl; do
            python -m venv "$RUNNER_TEMP/package-test"
            "$RUNNER_TEMP/package-test/bin/python" -m pip install --no-deps "$wheel"
            (
              cd "$RUNNER_TEMP"
              "$RUNNER_TEMP/package-test/bin/python" -I -c "import kntp; from importlib.metadata import metadata; m = metadata('kntp-lib'); assert m['Requires-Python'] == '>=3.10'; assert m['License-Expression'] == 'MIT'; assert 'LICENSE' in str(m.get_all('License-File')); print(kntp.__file__)"
              "$RUNNER_TEMP/package-test/bin/python" -I -m unittest discover -s "$GITHUB_WORKSPACE/tests" -v
            )
            rm -rf "$RUNNER_TEMP/package-test"
          done
